<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" role="img">
<title>lang_react_rag architecture</title>
<desc>A React UI talks to a FastAPI backend. Questions pass through input guardrails (regex filter, PII masking, LLM check) before a LangChain retriever searches Chroma using local embeddings. The retrieved context and question go to the Claude API, and the answer passes through output guardrails (grounding check, PII masking) before returning to FastAPI. A documents folder feeds the embeddings step.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
.coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
.coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
.amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
.amber .th { fill: #633806; } .amber .ts { fill: #854F0B; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.label { fill: #5F5E5A; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="880" height="530" fill="#FFFFFF"/>

<rect x="200" y="34" width="450" height="452" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts label" x="214" y="52">Backend container</text>

<g class="teal">
<rect x="30" y="70" width="130" height="56" rx="8"/>
<text class="th" x="95" y="89" text-anchor="middle" dominant-baseline="central">React UI</text>
<text class="ts" x="95" y="107" text-anchor="middle" dominant-baseline="central">nginx, port 3000</text>
</g>

<g class="teal">
<rect x="220" y="70" width="190" height="56" rx="8"/>
<text class="th" x="315" y="89" text-anchor="middle" dominant-baseline="central">FastAPI</text>
<text class="ts" x="315" y="107" text-anchor="middle" dominant-baseline="central">chat and reindex routes</text>
</g>

<g class="amber">
<rect x="220" y="156" width="190" height="56" rx="8"/>
<text class="th" x="315" y="175" text-anchor="middle" dominant-baseline="central">Input guardrails</text>
<text class="ts" x="315" y="193" text-anchor="middle" dominant-baseline="central">regex, PII mask, LLM check</text>
</g>

<g class="teal">
<rect x="220" y="242" width="190" height="56" rx="8"/>
<text class="th" x="315" y="261" text-anchor="middle" dominant-baseline="central">LangChain retriever</text>
<text class="ts" x="315" y="279" text-anchor="middle" dominant-baseline="central">top-k search, prompt</text>
</g>

<g class="teal">
<rect x="220" y="328" width="190" height="56" rx="8"/>
<text class="th" x="315" y="347" text-anchor="middle" dominant-baseline="central">Local embeddings</text>
<text class="ts" x="315" y="365" text-anchor="middle" dominant-baseline="central">MiniLM, runs locally</text>
</g>

<g class="gray">
<rect x="220" y="414" width="190" height="56" rx="8"/>
<text class="th" x="315" y="433" text-anchor="middle" dominant-baseline="central">Chroma</text>
<text class="ts" x="315" y="451" text-anchor="middle" dominant-baseline="central">persistent vector store</text>
</g>

<g class="gray">
<rect x="20" y="328" width="160" height="56" rx="8"/>
<text class="th" x="100" y="347" text-anchor="middle" dominant-baseline="central">Documents folder</text>
<text class="ts" x="100" y="365" text-anchor="middle" dominant-baseline="central">.txt and .md files</text>
</g>

<g class="amber">
<rect x="440" y="156" width="190" height="56" rx="8"/>
<text class="th" x="535" y="175" text-anchor="middle" dominant-baseline="central">Output guardrails</text>
<text class="ts" x="535" y="193" text-anchor="middle" dominant-baseline="central">grounding check, PII mask</text>
</g>

<g class="coral">
<rect x="690" y="242" width="150" height="56" rx="8"/>
<text class="th" x="765" y="261" text-anchor="middle" dominant-baseline="central">Claude API</text>
<text class="ts" x="765" y="279" text-anchor="middle" dominant-baseline="central">answers, guard checks</text>
</g>

<line x1="162" y1="98" x2="218" y2="98" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="315" y1="128" x2="315" y2="154" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="315" y1="214" x2="315" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="315" y1="300" x2="315" y2="326" class="arr" marker-end="url(#arrow)"/>
<line x1="315" y1="386" x2="315" y2="412" class="arr" marker-end="url(#arrow)"/>
<line x1="182" y1="356" x2="218" y2="356" class="arr" marker-end="url(#arrow)"/>
<line x1="412" y1="270" x2="688" y2="270" class="arr" marker-end="url(#arrow)"/>
<polyline points="765,240 765,184 632,184" class="arr" marker-end="url(#arrow)"/>
<polyline points="535,154 535,98 412,98" class="arr" marker-end="url(#arrow)"/>
<text class="ts label" x="550" y="260" text-anchor="middle">context + question</text>
<text class="ts label" x="753" y="214" text-anchor="end">answer</text>

<g class="teal"><rect x="40" y="502" width="12" height="12" rx="2"/></g>
<text class="ts label" x="58" y="509" dominant-baseline="central">App code</text>
<g class="amber"><rect x="150" y="502" width="12" height="12" rx="2"/></g>
<text class="ts label" x="168" y="509" dominant-baseline="central">Guardrails</text>
<g class="gray"><rect x="270" y="502" width="12" height="12" rx="2"/></g>
<text class="ts label" x="288" y="509" dominant-baseline="central">Data store</text>
<g class="coral"><rect x="390" y="502" width="12" height="12" rx="2"/></g>
<text class="ts label" x="408" y="509" dominant-baseline="central">External API</text>
</svg>
