<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img">
<title>lang_react_rag architecture</title>
<desc>A React UI talks to a FastAPI backend. The backend uses a LangChain retriever, local embeddings and Chroma, and calls the Claude API to generate answers. A documents folder feeds the embeddings step.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
.coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
.coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.label { fill: #5F5E5A; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="460" fill="#FFFFFF"/>

<rect x="210" y="34" width="260" height="372" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts label" x="224" y="52">Backend container</text>

<g class="teal">
<rect x="30" y="70" width="130" height="56" rx="8"/>
<text class="th" x="95" y="89" text-anchor="middle" dominant-baseline="central">React UI</text>
<text class="ts" x="95" y="107" text-anchor="middle" dominant-baseline="central">nginx, port 3000</text>
</g>

<g class="teal">
<rect x="240" y="70" width="200" height="56" rx="8"/>
<text class="th" x="340" y="89" text-anchor="middle" dominant-baseline="central">FastAPI</text>
<text class="ts" x="340" y="107" text-anchor="middle" dominant-baseline="central">chat and reindex routes</text>
</g>

<g class="teal">
<rect x="240" y="156" width="200" height="56" rx="8"/>
<text class="th" x="340" y="175" text-anchor="middle" dominant-baseline="central">LangChain retriever</text>
<text class="ts" x="340" y="193" text-anchor="middle" dominant-baseline="central">top-k search, prompt</text>
</g>

<g class="teal">
<rect x="240" y="242" width="200" height="56" rx="8"/>
<text class="th" x="340" y="261" text-anchor="middle" dominant-baseline="central">Local embeddings</text>
<text class="ts" x="340" y="279" text-anchor="middle" dominant-baseline="central">MiniLM, runs locally</text>
</g>

<g class="gray">
<rect x="240" y="328" width="200" height="56" rx="8"/>
<text class="th" x="340" y="347" text-anchor="middle" dominant-baseline="central">Chroma</text>
<text class="ts" x="340" y="365" text-anchor="middle" dominant-baseline="central">persistent vector store</text>
</g>

<g class="gray">
<rect x="20" y="242" width="160" height="56" rx="8"/>
<text class="th" x="100" y="261" text-anchor="middle" dominant-baseline="central">Documents folder</text>
<text class="ts" x="100" y="279" text-anchor="middle" dominant-baseline="central">.txt and .md files</text>
</g>

<g class="coral">
<rect x="510" y="156" width="130" height="56" rx="8"/>
<text class="th" x="575" y="175" text-anchor="middle" dominant-baseline="central">Claude API</text>
<text class="ts" x="575" y="193" text-anchor="middle" dominant-baseline="central">writes answers</text>
</g>

<line x1="162" y1="98" x2="238" y2="98" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="340" y1="128" x2="340" y2="154" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="340" y1="214" x2="340" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="300" x2="340" y2="326" class="arr" marker-end="url(#arrow)"/>
<line x1="442" y1="184" x2="508" y2="184" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="182" y1="270" x2="238" y2="270" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="40" y="428" width="12" height="12" rx="2"/></g>
<text class="ts label" x="58" y="435" dominant-baseline="central">App code</text>
<g class="gray"><rect x="150" y="428" width="12" height="12" rx="2"/></g>
<text class="ts label" x="168" y="435" dominant-baseline="central">Data store</text>
<g class="coral"><rect x="270" y="428" width="12" height="12" rx="2"/></g>
<text class="ts label" x="288" y="435" dominant-baseline="central">External API</text>
</svg>
